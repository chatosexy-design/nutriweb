<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NutriApp | Prototipo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">NutriApp</div>
    <nav class="app-nav">
      <a href="#" data-section="registro" class="nav-link active">Registro</a>
      <a href="#" data-section="calculadora" class="nav-link">Calculadora</a>
      <a href="#" data-section="comparar" class="nav-link">Comparar OMS</a>
      <a href="#" data-section="alertas" class="nav-link">Alertas</a>
    </nav>
  </header>
  <main id="app">
    <section id="registro" class="view">
      <h1>Registro</h1>
      <form id="registro-form" class="card">
        <div class="form-row">
          <label>Edad</label>
          <input type="number" id="edad" min="1" max="120" required>
        </div>
        <div class="form-row">
          <label>Peso (kg)</label>
          <input type="number" id="peso" min="1" max="400" step="0.1" required>
        </div>
        <div class="form-row">
          <label>Actividad física</label>
          <select id="actividad" required>
            <option value="sedentaria">Sedentaria</option>
            <option value="ligera">Ligera</option>
            <option value="moderada">Moderada</option>
            <option value="intensa">Intensa</option>
          </select>
        </div>
        <button type="submit" class="btn primary">Guardar</button>
        <div id="registro-ok" class="hint"></div>
      </form>
    </section>
    <section id="calculadora" class="view hidden">
      <h1>Calculadora nutricional</h1>
      <div class="card">
        <form id="alimento-form">
          <div class="grid-2">
            <div class="form-row">
              <label>Alimento</label>
              <input type="text" id="alimento-nombre" required>
            </div>
            <div class="form-row">
              <label>Fibra (g)</label>
              <input type="number" id="alimento-fibra" min="0" step="0.1" required>
            </div>
            <div class="form-row">
              <label>Azúcar (g)</label>
              <input type="number" id="alimento-azucar" min="0" step="0.1" required>
            </div>
            <div class="form-row">
              <label>Sodio (mg)</label>
              <input type="number" id="alimento-sodio" min="0" step="1" required>
            </div>
            <div class="form-row">
              <label>Grasa saturada (g)</label>
              <input type="number" id="alimento-grasa" min="0" step="0.1" required>
            </div>
          </div>
          <button type="submit" class="btn accent">Agregar</button>
        </form>
      </div>
      <div class="card">
        <h2>Lista de alimentos</h2>
        <ul id="food-list" class="list"></ul>
      </div>
      <div class="card">
        <h2>Totales del día</h2>
        <div id="totales" class="totals"></div>
      </div>
    </section>
    <section id="comparar" class="view hidden">
      <h1>Comparar con OMS</h1>
      <div class="card">
        <div id="comparacion" class="comparacion"></div>
      </div>
    </section>
    <section id="alertas" class="view hidden">
      <h1>Alertas</h1>
      <div class="card">
        <ul id="alert-list" class="alerts"></ul>
        <div class="example">Ejemplo: "Te falta fibra hoy"</div>
      </div>
    </section>
  </main>
  <footer class="app-footer">
    <div>Prototipo navegable</div>
  </footer>
  <script src="app.js"></script>
</body>
</html>
